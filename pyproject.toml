[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "GoMate"
version = "0.1.0"
description = "An AI coding assistant named GoMate built with LangGraph and DeepSeek"
readme = "README.md"
authors = [{name = "LonelyReed", email = "cxlxh220416@163.com"}]
license = {text = "MIT"}   # 或者其他开源协议
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "langgraph>=1.1.9",
    "langgraph-checkpoint>=4.0.2",
    "langgraph-sdk>=0.3.13",
    "langchain>=1.2.15",
    "langchain-core>=1.3.1",
    "langchain-deepseek>=1.0.1",
    "langchain-openai>=1.2.0",
    "click>=8.3.3",
    "rich>=15.0.0",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
]

[project.scripts]
gm = "coder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]